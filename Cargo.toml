[package]
name = "sam2-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native Rust implementation of Meta SAM2, initially using Candle"
license = "Apache-2.0"

[dependencies]
# Local Candle fork: `sam2-cpu-perf` starts from the comprehensive integration
# branch, which already includes the verified CPU Conv2D fast paths. Keep this
# direct path while profiling SAM2; replace it with a released revision only
# after the benchmarked changes are upstreamed.
candle-core = { path = "/home/mahogny/github/claude/candle/candle-core" }
candle-nn = { path = "/home/mahogny/github/claude/candle/candle-nn" }
safetensors = "0.8.0"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[features]
default = []
# SAM2 is convolution-heavy; CUDA without cuDNN would benchmark a fallback
# implementation rather than a meaningful counterpart to PyTorch CUDA.
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-core/cudnn", "candle-nn/cudnn"]
# Optional CPU BLAS path for a separately labelled CPU experiment.
mkl = ["candle-core/mkl", "candle-nn/mkl"]
