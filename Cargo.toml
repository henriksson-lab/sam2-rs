[package]
name = "sam2-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native Rust implementation of Meta SAM2, initially using Candle"
license = "Apache-2.0"

[dependencies]
# Pin the tested CPU/training Candle revision without a sibling checkout.
# All consumers must use this same source identity for Candle tensor types.
candle-core = { git = "https://github.com/mahogny/candle.git", rev = "0998c8c655ae84330149ddbff509916254b887a1" }
candle-nn = { git = "https://github.com/mahogny/candle.git", rev = "0998c8c655ae84330149ddbff509916254b887a1" }
safetensors = "0.8.0"
thiserror = "2"
rayon = "1.11"
hf-hub = { version = "0.4.3", optional = true, default-features = false, features = ["ureq"] }
image = { version = "=0.25.9", optional = true, default-features = false, features = ["jpeg", "png"] }
ffmpeg-next = { version = "9.0.0", optional = true, default-features = false, features = ["codec", "format", "software-scaling"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cudaforge = "0.1.6"

[features]
default = []
# Download published checkpoints from the Hugging Face Hub into its standard
# content-addressed cache. Authentication and cache overrides use HF_* env vars.
huggingface = ["dep:hf-hub"]
# Decode JPEG/PNG images and numerically ordered JPEG frame directories.
image-decoding = ["dep:image"]
# Decode encoded video files through the system FFmpeg libraries. This also
# enables image decoding so callers can accept either upstream input form.
video-decoding = ["image-decoding", "dep:ffmpeg-next"]
# SAM2 is convolution-heavy; CUDA without cuDNN would benchmark a fallback
# implementation rather than a meaningful counterpart to PyTorch CUDA.
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-core/cudnn", "candle-nn/cudnn"]
# Optional CPU BLAS path for a separately labelled CPU experiment.
mkl = ["candle-core/mkl", "candle-nn/mkl"]
# Experimental: route long Hiera CPU attention through Candle's fused f32
# online-softmax implementation. Benchmarked separately from the default.
cpu-flash-attention = []
# Linux/x86-64 experiment: enable Candle's glibc 2.35+ AVX-512 vector exact
# GELU. Kept explicit because it is a system-ABI dependency, not portable.
cpu-glibc-vector-math = ["candle-core/glibc-vector-math", "candle-nn/glibc-vector-math"]
