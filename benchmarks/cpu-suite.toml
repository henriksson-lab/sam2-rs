schema_version = 1

[suite]
name = "sam2-device-parity"
devices = ["cuda", "cpu"]
headline_weights = { cuda = 70, cpu = 30 }
primary_workers = 20
portability_workers = [8, 20]
cpu_affinity = { "8" = "0-7", "20" = "0-19" }
paired_processes = 4
alternate_order = true
minimum_measured_seconds = 2.0
# A retained headline row must not hide a thermally throttled, preempted, or
# otherwise pathological process inside its arithmetic mean.
max_repeat_spread_ratio = 1.25
rust_features = ["cpu-flash-attention", "cpu-glibc-vector-math"]

[gates.p0]
weighted_latency_ratio_max = 1.00
cell_latency_ratio_max = 1.10
weighted_rss_ratio_max = 0.80
cell_rss_ratio_max = 1.00
passing_cell_regression_max = 0.03

[gates.gpu_p0]
weighted_latency_ratio_max = 1.00
cell_latency_ratio_max = 1.10
weighted_device_memory_ratio_max = 1.00
cell_device_memory_ratio_max = 1.10
cell_host_rss_ratio_max = 1.00
passing_cell_regression_max = 0.03
require_eager = true

[gates.p1]
weighted_latency_ratio_max = 1.05
cell_latency_ratio_max = 1.15
cell_rss_ratio_max = 1.00
weighted_device_memory_ratio_max = 1.00
cell_device_memory_ratio_max = 1.10

[parity]
mask_logit_max_abs = 0.0002
mask_logit_mean_abs = 0.00003
exact_fields = ["frame_indices", "object_ids", "rles", "thresholded_masks"]

[parity.video]
# Autoregressive float drift accumulates over dozens of memory updates. The
# user-visible thresholded masks must remain exact; selected logits use this
# independently reported envelope rather than the single-frame image bound.
mask_logit_max_abs = 0.1
mask_logit_mean_abs = 0.01
threshold_masks_exact = true

[parity.video_edit]
# Three independently propagated objects include a correction and reverse
# pass. Floating-point drift is largest on the corrected frame, while the
# thresholded masks remain bit-exact. Keep this distinct from ordinary video
# propagation so its slightly wider bound cannot hide a V2/V4 regression.
mask_logit_max_abs = 0.12
mask_logit_mean_abs = 0.01
threshold_masks_exact = true

[parity.large_model]
# The deeper Base-Plus/Large encoders accumulate slightly more backend-order
# drift than Tiny/Small. Mean logit error and threshold decisions remain under
# the ordinary image requirements; keep the wider maximum local to M1.
mask_logit_max_abs = 0.0005
mask_logit_mean_abs = 0.00003
threshold_masks_exact = true

[parity.public_image]
# Public RGB8 APIs include independent resize implementations before reaching
# the already-gated model tensors. Keep their observed maximum local to API
# lifetime coverage; mean drift and user-visible threshold decisions retain
# the ordinary image requirements.
mask_logit_max_abs = 0.0005
mask_logit_mean_abs = 0.00003
threshold_masks_exact = true

[variants.tiny]
rust = "tiny"
python_config = "configs/sam2.1/sam2.1_hiera_t.yaml"
rust_checkpoint = "checkpoints/sam2.1_hiera_tiny.safetensors"
python_checkpoint = "checkpoints/sam2.1_hiera_tiny.pt"

[variants.small]
rust = "small"
python_config = "configs/sam2.1/sam2.1_hiera_s.yaml"
rust_checkpoint = "checkpoints/sam2.1_hiera_small.safetensors"
python_checkpoint = "checkpoints/sam2.1_hiera_small.pt"

[variants.base_plus]
rust = "base-plus"
python_config = "configs/sam2.1/sam2.1_hiera_b+.yaml"
rust_checkpoint = "checkpoints/sam2.1_hiera_base_plus.safetensors"
python_checkpoint = "checkpoints/sam2.1_hiera_base_plus.pt"

[variants.large]
rust = "large"
python_config = "configs/sam2.1/sam2.1_hiera_l.yaml"
rust_checkpoint = "checkpoints/sam2.1_hiera_large.safetensors"
python_checkpoint = "checkpoints/sam2.1_hiera_large.pt"

# Coordinates below are in source-image pixels and come from the upstream
# SAM2 notebooks where available. The fixture builder freezes scaled model
# coordinates and decoded RGB bytes so both implementations see identical data.
[fixtures.bedroom]
source = "vendor/segment-anything-2/notebooks/videos/bedroom/00089.jpg"
license = "Apache-2.0 (SAM2 example asset)"
positive_points = [[210.0, 350.0]]
negative_points = [[82.0, 410.0]]
correction_points = [[250.0, 220.0]]
box = [160.0, 180.0, 360.0, 500.0]

[fixtures.truck]
source = "vendor/segment-anything-2/notebooks/images/truck.jpg"
license = "Apache-2.0 (SAM2 example asset)"
positive_points = [[500.0, 375.0], [1125.0, 625.0]]
negative_points = [[575.0, 750.0]]
correction_points = [[650.0, 750.0]]
box = [425.0, 600.0, 700.0, 875.0]

[fixtures.groceries]
source = "vendor/segment-anything-2/notebooks/images/groceries.jpg"
license = "Apache-2.0 (SAM2 example asset)"
positive_points = [[400.0, 300.0], [630.0, 300.0]]
negative_points = [[550.0, 420.0]]
correction_points = [[375.0, 270.0]]
box = [450.0, 170.0, 520.0, 350.0]

[fixtures.cars]
source = "vendor/segment-anything-2/notebooks/images/cars.jpg"
license = "Apache-2.0 (SAM2 example asset)"
positive_points = [[1130.0, 760.0], [1730.0, 720.0]]
negative_points = [[780.0, 880.0]]
correction_points = [[1450.0, 650.0]]
box = [850.0, 420.0, 1510.0, 1050.0]

[fixtures.portrait]
derived_from = "cars"
transform = "crop:center:900x1500"
license = "Apache-2.0 (derived from SAM2 example asset)"
positive_points = [[450.0, 750.0]]
negative_points = [[150.0, 1250.0]]
correction_points = [[620.0, 560.0]]
