# Motion-diverse upstream gallery footage. Sampling across the clip avoids
# turning video coverage into another near-static bedroom-only measurement.
[videos.juggle_mp4]
source = "vendor/segment-anything-2/demo/data/gallery/05_default_juggle.mp4"
frames = 32
start = 0
stride = 4
license = "Apache-2.0 (SAM2 demo gallery asset)"

# `operation` is an API-stable runner operation, not prose. Every matrix row
# expands to one independently runnable process per variant/fixture pair.
[[cells]]
id = "I1"
tier = "p0"
devices = ["cuda", "cpu"]
gpu_weight = 12
gpu_modes = ["eager"]
family = "image"
operation = "first_point"
variants = ["tiny"]
fixtures = ["bedroom", "truck", "groceries", "cars", "portrait", "odd"]
weight = 14
warmups = 1
iterations = 5
gpu_iterations = 30

